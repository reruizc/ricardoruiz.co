<!DOCTYPE html>
<html lang="es" id="htmlRoot">
<head>
  <script defer src="/track.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">Planes · Ricardo Ruiz</title>
  <meta name="description" content="Planes de ricardoruiz.co: resultados electorales 2010-2026 hasta la mesa, Laboratorio de Políticas Públicas, delitos de la Policía 2015-2026 y el Congreso 2026-2030." />
  <meta property="og:title" content="Planes · Ricardo Ruiz" />
  <meta property="og:description" content="Resultados electorales 2010-2026, Laboratorio de Políticas Públicas, Policía y Congreso. Hasta el puesto de votación, gratis para todos." />
  <meta property="og:image" content="https://ricardoruiz.co/imagenes-index/proyectos/electoral.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="canonical" href="https://ricardoruiz.co/pricing.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    /* Helvetica Neue embebida (familia completa). El logo va aparte en Syne. */
    @font-face { font-family:'HelveticaNeue'; src:url('fonts/helveticaneue-thin.woff2') format('woff2'); font-weight:200; font-style:normal; font-display:swap; }
    @font-face { font-family:'HelveticaNeue'; src:url('fonts/helveticaneue-light.woff2') format('woff2'); font-weight:300; font-style:normal; font-display:swap; }
    @font-face { font-family:'HelveticaNeue'; src:url('fonts/helveticaneue.woff2') format('woff2'); font-weight:400; font-style:normal; font-display:swap; }
    @font-face { font-family:'HelveticaNeue'; src:url('fonts/helveticaneue-medium.woff2') format('woff2'); font-weight:500; font-style:normal; font-display:swap; }
    @font-face { font-family:'HelveticaNeue'; src:url('fonts/helveticaneue-bold.woff2') format('woff2'); font-weight:600 900; font-style:normal; font-display:swap; }
    @font-face { font-family:'HelveticaNeue'; src:url('fonts/helveticaneue-italic.woff2') format('woff2'); font-weight:400; font-style:italic; font-display:swap; }

    :root {
      --white: #f4f3ef;
      --black: #0e1220;
      --blue: #0047FF;
      --blue-light: #3d6fff;
      --orange: #f97316;
      --green: #4ade80;
      --dim: rgba(255,255,255,.55);
      --faint: rgba(255,255,255,.38);
      --card-bg: rgba(10,10,16,0.75);
      --card-border: rgba(255,255,255,0.07);
      --sans: 'HelveticaNeue', Helvetica, 'Helvetica Neue', Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: #060810; color: var(--white);
      font-family: var(--sans);
      overflow-x: hidden; cursor: none;
    }
    body::before { content:''; position:fixed; inset:0; z-index:-1;
      background:
        radial-gradient(1100px 600px at 78% -8%, rgba(0,71,255,0.18), transparent 60%),
        radial-gradient(900px 500px at 12% 108%, rgba(0,71,255,0.10), transparent 60%),
        #060810; }

    /* ── CURSOR ── */
    .cursor { position: fixed; width: 10px; height: 10px; background: var(--blue); border-radius: 50%;
      pointer-events: none; z-index: 100000; transform: translate(-50%,-50%); transition: transform .15s, background .2s, border .2s; }
    .cursor-ring { position: fixed; width: 34px; height: 34px; border: 1px solid rgba(0,71,255,.5); border-radius: 50%;
      pointer-events: none; z-index: 99999; transform: translate(-50%,-50%); opacity: .5; }

    /* ── NAV (barra electoral) ── */
    .electoral-nav{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:.9rem 2.5rem;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(4,6,16,.6);backdrop-filter:blur(8px)}
    .e-nav-left{display:flex;align-items:center;gap:1rem;min-width:0}
    .e-nav-right{display:flex;align-items:center;gap:1.2rem;flex-shrink:0}
    .electoral-nav-auth{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
    .e-btn-back{font-family:var(--sans);font-size:.782rem;letter-spacing:.08em;text-transform:uppercase;color:#4ade80;text-decoration:none;border:1.5px solid rgba(74,222,128,.4);padding:.35rem .8rem;transition:color .2s,border-color .2s,background .2s;flex-shrink:0;white-space:nowrap;cursor:none}
    .e-btn-back:hover{color:#060810;background:#4ade80;border-color:#4ade80}
    .e-btn-login,.e-btn-profile{font-family:var(--sans);font-size:.782rem;letter-spacing:.08em;text-transform:uppercase;color:var(--white);text-decoration:none;background:var(--orange);border:1.5px solid var(--orange);padding:.35rem .8rem;transition:background .2s,border-color .2s;cursor:none;white-space:nowrap}
    .e-btn-login:hover,.e-btn-profile:hover{background:#ea6d0d;border-color:#ea6d0d}
    .e-btn-register{font-family:var(--sans);font-size:.782rem;letter-spacing:.08em;text-transform:uppercase;color:var(--white);text-decoration:none;background:var(--blue);border:1.5px solid var(--blue);padding:.35rem .8rem;white-space:nowrap}
    .e-btn-register:hover{background:#0035cc;border-color:#0035cc}
    .e-user-plan{font-family:var(--sans);font-size:.69rem;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-light);background:rgba(0,71,255,.12);padding:.2rem .6rem;text-decoration:none;white-space:nowrap}
    .e-btn-logout{font-family:var(--sans);font-size:.782rem;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.25);background:none;border:none;cursor:none;padding:0;white-space:nowrap}
    .e-btn-logout:hover{color:rgba(255,255,255,.6)}
    .country-selector-wrap{position:relative}
    .country-btn{font-family:var(--sans);font-weight:500;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.45);background:none;border:1px solid rgba(255,255,255,.15);padding:.3rem .65rem;cursor:none;display:flex;align-items:center;transition:border-color .2s,color .2s;white-space:nowrap}
    .country-btn:hover,.country-btn.open{border-color:rgba(255,255,255,.35);color:rgba(255,255,255,.7)}
    .country-btn.open #countryChevron{transform:rotate(180deg)}
    .country-dropdown{position:absolute;top:calc(100% + 8px);right:0;background:#0e1220;border:1px solid rgba(255,255,255,.12);min-width:200px;display:none;flex-direction:column;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.3)}
    .country-dropdown.open{display:flex}
    .country-option{font-family:var(--sans);font-weight:500;font-size:.68rem;letter-spacing:.04em;padding:.65rem 1rem;cursor:none;display:flex;align-items:center;gap:.5rem;color:rgba(255,255,255,.5);border-bottom:1px solid rgba(255,255,255,.07);transition:background .15s;user-select:none}
    .country-option:last-child{border-bottom:none}
    .country-option:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.8)}
    .country-option.selected{color:var(--blue-light)}
    .country-check{font-size:.6rem;width:12px;opacity:0;color:var(--blue-light)}
    .country-option.selected .country-check{opacity:1}
    .logo-link{display:flex;align-items:center;gap:.55rem;text-decoration:none;opacity:.85;transition:opacity .2s;flex-shrink:0;cursor:none}
    .logo-link:hover{opacity:1}
    .logo-bars{display:flex;align-items:flex-end;gap:3px;height:20px}
    .logo-bar{width:5px;background:var(--blue);border-radius:1px 1px 0 0;opacity:.85}
    .logo-text{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(1.1rem,2vw,1.8rem);letter-spacing:-.03em;color:var(--white);line-height:1}
    .logo-text span{color:var(--blue)}

    /* ── BLOQUES COMUNES ── */
    .wrap { max-width:1200px; margin:0 auto; padding:0 2rem; }
    .sec { margin-top:4.2rem; }
    .eyebrow { font-weight:500; font-size:.68rem; letter-spacing:.2em; text-transform:uppercase; color:var(--blue-light); margin-bottom:.55rem; }
    .sec-title { font-weight:800; font-size:clamp(1.5rem,3vw,2.3rem); letter-spacing:-.025em; line-height:1.08; color:var(--white); }
    .sec-title em { font-style:normal; color:var(--blue-light); }
    .sec-sub { font-weight:400; font-size:.9rem; color:var(--dim); max-width:640px; line-height:1.65; margin-top:.7rem; }
    .sec-head { margin-bottom:1.6rem; }

    /* ── HERO ── */
    .pricing-hero { position:relative; text-align:center; padding: 3.4rem 2rem 2.2rem; overflow:hidden; }
    .pricing-hero-bg { position:absolute; top:-1.5rem; left:50%; transform:translateX(-50%);
      font-weight:800; font-size:clamp(5rem,16vw,13rem); letter-spacing:-.05em; line-height:1; color:transparent;
      -webkit-text-stroke:1px rgba(0,71,255,0.16); pointer-events:none; user-select:none; white-space:nowrap; }
    .pricing-label { position:relative; z-index:1; font-weight:500; font-size:.72rem; letter-spacing:.22em; text-transform:uppercase;
      color: var(--blue-light); margin-bottom:1rem; display:flex; align-items:center; justify-content:center; gap:1rem; }
    .pricing-label::before, .pricing-label::after { content:''; display:block; width:30px; height:1px; background:var(--blue); }
    .pricing-title { position:relative; z-index:1; font-weight:800;
      font-size:clamp(2.2rem, 5.6vw, 4.4rem); letter-spacing:-.03em; line-height:1.02; color:var(--white); margin-bottom:1.1rem; }
    .pricing-title em { font-style:normal; color:var(--blue-light); }
    .pricing-sub { position:relative; z-index:1; font-weight:400;
      font-size:clamp(.92rem, 1.4vw, 1.06rem); color:var(--dim); max-width:640px; margin:0 auto; line-height:1.65; }
    /* ── TOGGLES ── */
    .toggles-wrap { display:flex; align-items:center; justify-content:center; gap:2.5rem; flex-wrap:wrap; margin:0 auto 1.6rem; }
    .toggle-group { display:flex; align-items:center; gap:.7rem;
      font-weight:500; font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.35); }
    .toggle-group span.active { color:var(--white); font-weight:700; }
    .toggle-pill { position:relative; width:44px; height:22px; border-radius:22px; background:rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.18); cursor:none; transition:background .25s; flex-shrink:0; }
    .toggle-pill::after { content:''; position:absolute; top:2px; left:3px; width:15px; height:15px; border-radius:50%;
      background:var(--white); transition:transform .25s; }
    .toggle-pill.on { background:var(--blue); border-color:var(--blue); }
    .toggle-pill.on::after { transform:translateX(21px); }
    .toggle-save { font-size:.62rem; color:var(--green); letter-spacing:.08em; opacity:0; transition:opacity .25s; }
    .toggle-save.visible { opacity:1; }

    /* ── PLANES ── */
    .plans-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; }
    .plan-card { position:relative; background:var(--card-bg); border:1px solid var(--card-border);
      padding:1.6rem 1.4rem; display:flex; flex-direction:column; backdrop-filter:blur(6px); transition:border-color .25s; }
    .plan-card:hover { border-color:rgba(0,71,255,.5); }
    .plan-card.featured { background:linear-gradient(150deg, rgba(0,71,255,0.22), rgba(6,10,26,0.9) 60%); border-color:rgba(0,71,255,.5); }
    .plan-card.featured:hover { border-color:rgba(0,71,255,.85); }
    .plan-badge { display:flex; align-items:center; gap:.5rem; font-weight:500; font-size:.62rem;
      letter-spacing:.15em; text-transform:uppercase; color:rgba(255,255,255,.4); margin-bottom:.9rem; }
    .plan-badge-dot { width:5px; height:5px; border-radius:50%; background:var(--blue); flex-shrink:0; }
    .plan-featured-tag { font-weight:700; font-size:.58rem; letter-spacing:.1em; color:#060810;
      background:var(--green); padding:.18rem .5rem; margin-left:auto; }
    .plan-name { font-weight:800; font-size:1.35rem; letter-spacing:-.02em; color:var(--white); margin-bottom:.5rem; }
    .plan-desc { font-weight:400; font-size:.78rem; line-height:1.55; color:rgba(255,255,255,.5); margin-bottom:1.4rem; min-height:4.7em; }
    .plan-price-wrap { margin-bottom:1.4rem; }
    .plan-price { font-weight:800; font-size:1.9rem; letter-spacing:-.02em; color:var(--white);
      display:flex; align-items:baseline; gap:.35rem; }
    .plan-price-currency { font-weight:500; font-size:.66rem; letter-spacing:.1em; color:rgba(255,255,255,.4); }
    .plan-price-period { font-weight:400; font-size:.7rem; color:rgba(255,255,255,.4); margin-top:.25rem; }
    .plan-price-annual { font-weight:500; font-size:.64rem; letter-spacing:.05em; color:var(--green); margin-top:.3rem; min-height:1em; opacity:0; transition:opacity .25s; }
    .plan-price-annual.visible { opacity:1; }
    .plan-free-tag { font-weight:800; font-size:1.6rem; letter-spacing:-.02em; color:var(--white); }
    .plan-features { list-style:none; margin-bottom:1.6rem; flex:1; }
    .plan-features li { font-weight:400; font-size:.76rem; line-height:1.5; color:rgba(255,255,255,.66);
      padding:.36rem 0 .36rem 1.1rem; position:relative; border-bottom:1px solid rgba(255,255,255,.04); }
    .plan-features li::before { content:'✓'; position:absolute; left:0; color:var(--green); font-size:.7rem; }
    .plan-features li.head { color:var(--white); font-weight:700; }
    .plan-features li.head::before { content:'+'; color:var(--blue-light); }
    .plan-cta { display:block; text-align:center; font-weight:700; font-size:.76rem; letter-spacing:.08em; text-transform:uppercase;
      padding:.72rem 1rem; text-decoration:none; cursor:none; transition:background .2s,color .2s,border-color .2s; }
    .plan-cta-outline { background:none; color:var(--white); border:1.5px solid rgba(255,255,255,.28); }
    .plan-cta-outline:hover { border-color:var(--white); }
    .plan-cta-dark { background:var(--blue); color:var(--white); border:1.5px solid var(--blue); }
    .plan-cta-dark:hover { background:#0035cc; border-color:#0035cc; }
    .compare-note { text-align:center; font-weight:400; font-size:.72rem; letter-spacing:.04em;
      color:rgba(255,255,255,.35); margin-top:1.3rem; }

    /* ── COMPARACIÓN ── */
    .comparison-table-wrap { overflow-x:auto; border:1px solid var(--card-border); background:var(--card-bg); backdrop-filter:blur(6px); }
    .comparison-table { width:100%; border-collapse:collapse; min-width:760px; }
    .comparison-table th { font-weight:700; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--white);
      text-align:center; padding:.9rem .8rem; border-bottom:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.03); width:15%; }
    .comparison-table th:first-child { text-align:left; width:auto; }
    .comparison-table th.plan-col-featured { color:var(--blue-light); }
    .comparison-table td { padding:.72rem .8rem; border-bottom:1px solid rgba(255,255,255,.05); text-align:center; vertical-align:middle; }
    .comparison-table tr.row:hover td { background:rgba(0,71,255,.05); }
    .comparison-table tr.grp td { text-align:left; font-weight:700; font-size:.66rem; letter-spacing:.16em; text-transform:uppercase;
      color:var(--blue-light); background:rgba(0,71,255,.07); padding:.6rem .8rem; border-bottom:1px solid rgba(0,71,255,.18); }
    .comparison-feature-cell { text-align:left !important; }
    .comparison-feature-title { font-weight:500; font-size:.8rem; color:rgba(255,255,255,.85); line-height:1.4; }
    .comparison-feature-note { font-weight:400; font-size:.68rem; color:var(--faint); margin-top:.2rem; line-height:1.45; }
    .comparison-check { color:var(--green); font-weight:700; font-size:.9rem; }
    .comparison-dash { color:rgba(255,255,255,.2); }
    .comparison-value { font-weight:500; font-size:.74rem; color:var(--blue-light); line-height:1.35; }
    .comparison-footnote { font-weight:400; font-size:.78rem; color:rgba(255,255,255,.45); margin-top:1rem; line-height:1.6; max-width:780px; }

    /* ── PRÓXIMAMENTE ── */
    .up-eyebrow { color:#ffa057; }
    .upcoming { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; }
    .up { display:flex; flex-direction:column; gap:.45rem; background:var(--card-bg); border:1px solid var(--card-border);
      padding:1.2rem 1.3rem; text-decoration:none; cursor:none; backdrop-filter:blur(6px); transition:border-color .25s; }
    .up:hover { border-color:rgba(249,115,22,.5); }
    .up-title { font-weight:800; font-size:1.05rem; color:var(--white); }
    .up-desc { font-weight:400; font-size:.8rem; line-height:1.55; color:var(--dim); }
    .up-link { font-weight:700; font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:#ffa057; margin-top:.2rem; }

    /* ── FAQ ── */
    .context-section { padding-bottom:3rem; }
    .context-grid { display:grid; grid-template-columns:1fr 2fr; gap:3rem; align-items:start; }
    .context-desc { font-weight:400; font-size:.86rem; color:var(--dim); line-height:1.7; margin-top:.9rem; }
    .faq-list { display:flex; flex-direction:column; gap:6px; }
    .faq-item { background:var(--card-bg); border:1px solid var(--card-border); padding:1.1rem 1.3rem; backdrop-filter:blur(6px); transition:border-color .25s; }
    .faq-item:hover { border-color:rgba(0,71,255,.4); }
    .faq-q { font-weight:700; font-size:.85rem; color:var(--white); margin-bottom:.4rem; }
    .faq-a { font-weight:400; font-size:.78rem; color:var(--dim); line-height:1.6; }

    /* ── FOOTER ── */
    footer { border-top:1px solid rgba(255,255,255,.07); padding:.8rem 2.5rem;
      display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap;
      font-weight:500; font-size:.7rem; letter-spacing:.06em; color:rgba(255,255,255,.28); }
    footer a { color:rgba(255,255,255,.35); text-decoration:none; transition:color .2s; cursor:none; }
    footer a:hover { color:var(--white); }

    /* ── RESPONSIVE ── */
    @media (max-width: 1080px) {
      .plans-grid { grid-template-columns:repeat(2,1fr); }
    }
    @media (max-width: 900px) {
      body { cursor:auto; }
      .cursor,.cursor-ring { display:none; }
      .toggle-pill, .plan-cta, .up, .e-btn-back { cursor:pointer; }
      .pricing-hero { padding:2.2rem 1.1rem 1.6rem; }
      .wrap { padding-left:1.1rem; padding-right:1.1rem; }
      .sec { margin-top:3.2rem; }
      .context-grid { grid-template-columns:1fr; gap:1.6rem; }
      footer { padding:.8rem 1.1rem; flex-direction:column; text-align:center; }
      /* Nav en móvil: logo centrado línea 1, volver+auth línea 2 */
      .electoral-nav { flex-direction: column; align-items: stretch; padding: .6rem 1.1rem; gap: .5rem; }
      .e-nav-right { order: 1; width: 100%; position: relative; justify-content: center; gap: .8rem; margin: 0; min-height: 26px; }
      .e-nav-left { order: 2; width: 100%; justify-content: center; gap: .6rem; flex-wrap: wrap; row-gap: .45rem; }
      .country-selector-wrap { position: absolute; left: 0; top: 50%; transform: translateY(-50%); }
      .electoral-nav-auth { gap: .5rem; flex-wrap: wrap; justify-content: center; }
      .e-btn-back, .e-btn-login, .e-btn-register, .e-btn-profile, .e-btn-logout { font-size: .68rem; letter-spacing: .06em; }
      .e-btn-login, .e-btn-register, .e-btn-profile, .e-btn-back { padding: .3rem .55rem; }
      .e-user-plan { font-size: .6rem; padding: .15rem .45rem; }
      .country-btn { font-size: .54rem; padding: .24rem .46rem; letter-spacing: .05em; }
      .country-dropdown { right: auto; left: 0; }
      .logo-text { font-size: clamp(.7rem, 3.3vw, .9rem); }
      .logo-bars { height: 11px; }
      .logo-bar { width: 2.5px; }
      /* La primera columna de la comparación se queda quieta al deslizar */
      .comparison-table td:first-child, .comparison-table th:first-child { position:sticky; left:0; background:#0b0e18; z-index:1; min-width:190px; }
      .comparison-table tr.grp td { position:static; }
    }
    @media (max-width: 620px) {
      .plans-grid, .upcoming { grid-template-columns:1fr; }
      .plan-desc { min-height:0; }
      .toggles-wrap { gap:1.2rem; }
      /* En el teléfono la columna fija es angosta y sin notas: si no, tapa la tabla */
      .comparison-table { min-width:600px; }
      .comparison-table td:first-child, .comparison-table th:first-child { min-width:0; width:142px; max-width:142px; }
      .comparison-feature-note { display:none; }
      .comparison-feature-title { font-size:.74rem; }
      .comparison-table td, .comparison-table th { padding:.6rem .55rem; }
      .comparison-value { font-size:.68rem; }
    }
    @media (max-width: 360px) {
      .electoral-nav { padding-left: .8rem; padding-right: .8rem; }
      .country-btn { font-size: .52rem; padding: .22rem .42rem; letter-spacing: .04em; }
      .logo-text { font-size: 9.5px; }
      .logo-bars { height: 10px; }
      .logo-bar { width: 2.5px; }
    }
  </style>
</head>
<body>

  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <nav class="electoral-nav">
    <div class="e-nav-left">
      <a href="index.html" class="e-btn-back" id="nav-back">← Inicio</a>
      <div class="electoral-nav-auth" id="nav-auth-area"></div>
    </div>
    <div class="e-nav-right">
      <div class="country-selector-wrap">

            { feature: '2015-2026 犯罪数据与 2026-2030 国会', values: { free: true, pro: true, premium: true, custom: true } },
          ]},
          { group: '下载', rows: [
            { feature: '每月文件数', values: { free: '仅 2026', pro: '3', premium: '10', custom: '定制' } },
          ]},
        ],
        upLabel: '即将推出 · 独立产品',
        upcoming: [
          { key:'c360', title:'Candidato 360', desc:'面向 2027 年地方选举的竞选看板。', cta:'了解更多 →' },
          { key:'micong', title:'Mi Congreso', desc:'面向国会议员及其团队的工作空间。', cta:'试用预览版 →' },
        ],
        ctxTitle: '常见<em>问题</em>。',
        footerRole: '数据顾问与公共政策分析师',
        faqs: [
          { q: '不付费能看到什么？', a: '2010 至 2026 年细到投票站的选举结果（免费账户可到投票桌）、全部警方与国会数据，以及实验室的八个模块。' },
          { q: 'Candidato 360 和 Mi Congreso 包含在我的计划中吗？', a: '不包含。它们是独立产品，有各自的访问权限。' },
          { q: '可以随时取消吗？', a: '可以。无最低承诺：在面板中取消，访问持续到已付费周期结束。' },
          { q: '定制版包含什么？', a: '直接合作：我们讨论你的需求，共同确定范围。' },
        ],
        registerDone: '账户已创建 · 请选择计划继续',
      },
    };

    // ─── STATE ────────────────────────────────────────────────────────────────
    let currentLang     = localStorage.getItem('rr-lang') || 'co';
    let billingAnnual   = false;
    let currencyUSD     = false;
    const T = () => i18n[currentLang] || i18n.co;

    // Cadena por idioma (us, co, cn, br)
    function LSTR(us, co, cn, brr, lang) {
      const l = lang || currentLang;
      return l === 'us' ? us : l === 'cn' ? cn : l === 'br' ? brr : co;
    }
    const $ = id => document.getElementById(id);

    // ─── TOGGLES ─────────────────────────────────────────────────────────────
    function toggleBilling() {
      billingAnnual = !billingAnnual;
      $('toggle-billing').classList.toggle('on', billingAnnual);
      $('toggle-monthly-label').classList.toggle('active', !billingAnnual);
      $('toggle-annual-label').classList.toggle('active', billingAnnual);
      $('toggle-save').classList.toggle('visible', billingAnnual);
      renderPlans();
    }
    function toggleCurrency() {
      currencyUSD = !currencyUSD;
      $('toggle-currency').classList.toggle('on', currencyUSD);
      $('toggle-cop-label').classList.toggle('active', !currencyUSD);
      $('toggle-usd-label').classList.toggle('active', currencyUSD);
      updateToggleSave();
      renderPlans();
    }

    // ─── AHORRO ANUAL ─────────────────────────────────────────────────────────
    // Precio mensual sin descuento en la moneda que se muestra. El mensual en
    // USD sigue la misma proporción anual/mensual que el COP, que es lo que
    // cobra Wompi: así el ahorro es el mismo en las dos monedas.
    function monthlyPrice(plan) {
      if (currencyUSD) {
        const ratio = plan.priceCOPMonthly ? plan.priceCOPMonthly / plan.priceCOP : 1 / 0.8;
        return Math.round(plan.priceUSD * ratio);
      }
      return plan.priceCOPMonthly || Math.round(plan.priceCOP / 0.8 / 1000) * 1000;
    }
    // Ahorro de pagar el año frente al mensual, en %. Sale de los precios.
    function annualSavingPct(plan) {
      if (plan.free || plan.custom) return 0;
      const anual = currencyUSD ? plan.priceUSD : plan.priceCOP;
      return Math.round((1 - anual / monthlyPrice(plan)) * 100);
    }
    function updateToggleSave() {
      const max = Math.max(0, ...T().plans.map(annualSavingPct));
      $('toggle-save').textContent = T().toggleSave.replace('{n}', max);
    }

    function formatPrice(plan) {
      if (plan.free || plan.custom) return null;
      const period = billingAnnual
        ? LSTR('/mo · billed annually','/mes · facturado anualmente','/月 · 按年计费','/mês · faturado anualmente')
        : LSTR('/month','/mes','/月','/mês');
      if (currencyUSD) {
        const p = billingAnnual ? plan.priceUSD : monthlyPrice(plan);
        return { amount: '$' + p, currency: 'USD', period };
      }
      const p = billingAnnual ? plan.priceCOP : monthlyPrice(plan);
      return { amount: '$' + p.toLocaleString('es-CO'), currency: 'COP', period };
    }

    // ─── WOMPI: enlaces de pago por plan y facturación ────────────────────────
    // Viven en wompi-links.js, compartido con login.html. Cada enlace debe
    // existir también en LINK_PLAN_MAP del worker rr-auth, o el pago no activa el plan.
    const WOMPI_LINKS = window.RR_WOMPI_LINKS || {};

    function startPayment(planId, planName) {
      const token   = localStorage.getItem('rr-token');
      const user    = JSON.parse(localStorage.getItem('rr-user') || 'null');
      const billing = billingAnnual ? 'anual' : 'mensual';
      // Guardar plan pendiente para el dashboard y para retomar después del registro
      localStorage.setItem('rr-pending-plan', JSON.stringify({
        planId: planId + '_' + billing, planName, billing, timestamp: Date.now()
      }));
      if (!token || !user) {
        localStorage.setItem('rr-desired-plan', JSON.stringify({
          planId, planName, billing, timestamp: Date.now()
        }));
        window.location.href = 'register.html?next=pay';
        return;
      }
      const baseLink = WOMPI_LINKS[planId]?.[billing];
      if (!baseLink) return;
      // El correo va pre-llenado en Wompi y en customer_email del webhook;
      // reference es el respaldo si llega vacío o con otro correo.
      const params = new URLSearchParams({
        'customer-email': user.email,
        'reference': `rr-${user.email}-${planId}-${billing}-${Date.now()}`
      });
      window.location.href = `${baseLink}?${params.toString()}`;
    }

    // ─── RENDER ──────────────────────────────────────────────────────────────
    function renderPlans() {
      const t = T();
      const user = JSON.parse(localStorage.getItem('rr-user') || 'null');
      // El plan gratis es «Básico»: el worker puede llamarlo free, basico o basic.
      const userPlan = user && (['basico','basic'].includes(user.plan) ? 'free' : user.plan);

      $('plans-grid').innerHTML = t.plans.map(plan => {
        const price = formatPrice(plan);
        const isCurrent = !!user && userPlan === plan.id;

        const priceHTML = plan.free || plan.custom
          ? `<div class="plan-price-wrap">
               <div class="plan-price"><span class="plan-free-tag">${plan.free ? LSTR('Free','Gratis','免费','Grátis') : LSTR('Custom','A medida','定制','Sob medida')}</span></div>
               <div class="plan-price-period">${plan.free ? LSTR('forever','siempre','永久','para sempre') : LSTR('contact us','conversemos','联系我们','fale conosco')}</div>
               <div class="plan-price-annual">&nbsp;</div>
             </div>`
          : `<div class="plan-price-wrap">
               <div class="plan-price">
                 <span class="plan-price-currency">${price.currency}</span>
                 <span>${price.amount}</span>
               </div>
               <div class="plan-price-period">${price.period}</div>
               <div class="plan-price-annual ${billingAnnual ? 'visible' : ''}">
                 ${(n => LSTR(`${n}% off vs monthly`,`Ahorras ${n} % frente al mensual`,`比月付节省${n}%`,`${n}% de economia vs mensal`))(annualSavingPct(plan))}
               </div>
             </div>`;

        const ctaText = isCurrent ? LSTR('Current plan','Plan actual','当前计划','Plano atual') : plan.cta;
        const ctaDisabled = isCurrent ? 'style="opacity:.4;pointer-events:none;"' : '';
        const ctaAttr = (plan.id === 'pro' || plan.id === 'premium') && !isCurrent
          ? `href="#" onclick="startPayment('${plan.id}','${plan.name}');return false;"`
          : `href="${plan.ctaHref}"${plan.custom ? ' target="_blank" rel="noopener"' : ''}`;

        const featuresHTML = plan.features.map(f =>
          typeof f === 'string' ? `<li>${f}</li>` : `<li class="head">${f.head}</li>`).join('');

        return `
          <div class="plan-card ${plan.featured ? 'featured' : ''}">
            <div class="plan-badge">
              <div class="plan-badge-dot"></div>
              ${(plan.free || plan.custom ? plan.name : plan.id).toUpperCase()}
              ${plan.featuredTag ? `<span class="plan-featured-tag">${plan.featuredTag}</span>` : ''}
            </div>
            <div class="plan-name">${plan.name}</div>
            <div class="plan-desc">${plan.desc}</div>
            ${priceHTML}
            <ul class="plan-features">${featuresHTML}</ul>
            <a ${ctaAttr} class="plan-cta plan-cta-${plan.ctaStyle}" ${ctaDisabled}>${ctaText}</a>
          </div>`;
      }).join('');
    }

    function renderComparison() {
      const t = T();
      const plans = t.plans;
      const cell = v => v === true
        ? '<span class="comparison-check">✓</span>'
        : (v === false || v == null)
        ? '<span class="comparison-dash">—</span>'
        : `<span class="comparison-value">${v}</span>`;
      const head = `<thead><tr><th>${t.featureCol}</th>${plans.map(p =>
        `<th class="${p.featured ? 'plan-col-featured' : ''}">${p.name}</th>`).join('')}</tr></thead>`;
      const body = t.comparisonGroups.map(g =>
        `<tr class="grp"><td colspan="${plans.length + 1}">${g.group}</td></tr>` +
        g.rows.map(r => `
          <tr class="row">
            <td class="comparison-feature-cell">
              <div class="comparison-feature-title">${r.feature}</div>
              ${r.note ? `<div class="comparison-feature-note">${r.note}</div>` : ''}
            </td>
            ${plans.map(p => `<td>${cell(r.values[p.id])}</td>`).join('')}
          </tr>`).join('')).join('');
      $('comparison-table').innerHTML = head + `<tbody>${body}</tbody>`;
    }

    function renderUpcoming() {
      $('upcoming').innerHTML = T().upcoming.map(u => `
        <a class="up" href="${HREF[u.key]}">
          <span class="up-title">${u.title}</span>
          <span class="up-desc">${u.desc}</span>
          <span class="up-link">${u.cta}</span>
        </a>`).join('');
    }

    function renderFAQ() {
      $('faq-list').innerHTML = T().faqs.map(f => `
        <div class="faq-item">
          <div class="faq-q">${f.q}</div>
          <div class="faq-a">${f.a}</div>
        </div>`).join('');
    }

    // ─── SESSION NAV ─────────────────────────────────────────────────────────
    function updateNavAuth() {
      const token = localStorage.getItem('rr-token');
      const user  = JSON.parse(localStorage.getItem('rr-user') || 'null');
      const area  = $('nav-auth-area');
      if (!area) return;
      if (token && user) {
        const planLabels = currentLang === 'us'
          ? { free:'Basic', basico:'Basic', pro:'Pro', premium:'Premium', basic:'Basic', analysis:'Analysis', full:'Full' }
          : currentLang === 'cn'
            ? { free:'基础版', basico:'基础版', pro:'Pro', premium:'Premium', basic:'基础版', analysis:'分析版', full:'完整版' }
            : currentLang === 'br'
              ? { free:'Básico', basico:'Básico', pro:'Pro', premium:'Premium', basic:'Básico', analysis:'Análise', full:'Completo' }
              : { free:'Básico', basico:'Básico', pro:'Pro', premium:'Premium', basic:'Básico', analysis:'Análisis', full:'Completo' };
        area.dataset.loggedIn = '1';
        area.innerHTML = `
          <span class="e-user-plan">${planLabels[user.plan] || user.plan}</span>
          <a href="dashboard.html" class="e-btn-profile">${LSTR('My dashboard','Mi panel','我的面板','Meu painel')}</a>
          <button class="e-btn-logout" onclick="logOutPage()">${LSTR('Log out','Salir','退出','Sair')}</button>`;
      } else {
        delete area.dataset.loggedIn;
        area.innerHTML = `
          <a href="login.html?next=pricing.html" class="e-btn-login">${LSTR('Log in','Iniciar sesión','登录','Entrar')}</a>
          <a href="elige-plan.html" class="e-btn-register">${LSTR('Sign up','Registrarse','注册','Cadastrar')}</a>`;
      }
    }
    async function logOutPage() {
      const token = localStorage.getItem('rr-token');
      if (token) { try { await fetch('https://rr-auth.reruizc.workers.dev/auth/logout', { method:'POST', headers:{ 'Authorization':`Bearer ${token}` } }); } catch {} }
      localStorage.removeItem('rr-token');
      localStorage.removeItem('rr-user');
      window.location.reload();
    }

    // ─── SET LANGUAGE ─────────────────────────────────────────────────────────
    function setLanguage(lang) {
      const t = i18n[lang] || i18n.co;
      $('htmlRoot').lang = t.lang;
      $('pageTitle').textContent = t.title;
      $('nav-back').textContent = t.navBack;
      $('hero-bg-text').textContent = t.heroBg;
      $('pricing-label').textContent = t.pricingLabel;
      $('pricing-title').innerHTML = t.pricingTitle;
      $('pricing-sub').textContent = t.pricingSub;
      $('toggle-monthly-label').textContent = t.toggleMonthly;
      $('toggle-annual-label').textContent = t.toggleAnnual;
      $('toggle-cop-label').textContent = t.toggleCOP;
      $('toggle-usd-label').textContent = t.toggleUSD;
      $('compare-note').textContent = t.compareNote;
      $('comparison-title').textContent = t.comparisonTitle;
      $('up-label').textContent = t.upLabel;
      $('ctx-title').innerHTML = t.ctxTitle;
      $('footer-role').textContent = t.footerRole;
      updateToggleSave();
      renderPlans();
      renderComparison();
      renderUpcoming();
      renderFAQ();
      updateNavAuth();
    }

    // ─── CURSOR ───────────────────────────────────────────────────────────────
    // Delegado: los enlaces se re-pintan al cambiar de idioma o de facturación,
    // así que no se puede amarrar el evento a cada elemento.
    const cursor = $('cursor');
    const ring   = $('cursorRing');
    let mx=0,my=0,rx=0,ry=0;
    document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; cursor.style.left=mx+'px'; cursor.style.top=my+'px'; });
    (function ar(){ rx+=(mx-rx)*.12; ry+=(my-ry)*.12; ring.style.left=rx+'px'; ring.style.top=ry+'px'; requestAnimationFrame(ar); })();
    const cursorOn  = () => { cursor.style.transform='translate(-50%,-50%) scale(2.5)'; cursor.style.background='transparent'; cursor.style.border='1.5px solid var(--blue)'; ring.style.opacity='0'; };
    const cursorOff = () => { cursor.style.transform='translate(-50%,-50%) scale(1)'; cursor.style.background='var(--blue)'; cursor.style.border='none'; ring.style.opacity='.4'; };
    document.addEventListener('mouseover', e => { if (e.target.closest('a, button')) cursorOn(); });
    document.addEventListener('mouseout',  e => {
      const from = e.target.closest('a, button');
      if (from && !from.contains(e.relatedTarget)) cursorOff();
    });

    // ─── INIT ─────────────────────────────────────────────────────────────────
    // lang.js llama __applyLang al cambiar de idioma
    window.__applyLang = function(lang) {
      currentLang = lang;
      setLanguage(lang);
    };
    setLanguage(currentLang);

    // ── ¿Viene recién registrado desde register.html?next=pricing? ────────────
    if (localStorage.getItem('rr-register-done')) {
      localStorage.removeItem('rr-register-done');
      const banner = document.createElement('div');
      banner.style.cssText = 'position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:var(--black);color:#f4f3ef;border:1px solid #0047FF;font-family:var(--sans);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;padding:.85rem 1.75rem;z-index:999;white-space:nowrap;box-shadow:0 0 24px rgba(0,71,255,.18);transition:opacity .4s';
      banner.innerHTML = '<span style="color:#0047FF;margin-right:.6rem;">✓</span>' + T().registerDone;
      document.body.appendChild(banner);
      setTimeout(() => { banner.style.opacity = '0'; }, 5000);
      setTimeout(() => { banner.remove(); }, 5500);
    }
    // Llegar con #planes o #comparar después del render
    if (location.hash) { const el = document.querySelector(location.hash); if (el) el.scrollIntoView(); }
  </script>
  <script src="lang.js"></script>
</body>
</html>
