<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>05 · La estrategia · Nuevo Liberalismo rumbo a 2027</title>
<link rel="stylesheet" href="base.css?v=20261110i">
<style>
  .eje{margin:18px 0 0;padding:22px 26px;border-left:4px solid var(--nl-solid);background:linear-gradient(90deg,rgba(194,10,0,.14),transparent 85%);font-size:clamp(1.15rem,1.9vw,1.55rem);line-height:1.4;color:#fff;font-weight:500;max-width:60ch}
  .eje small{display:block;margin-top:12px;font-size:.84rem;font-weight:400;color:var(--ink2);line-height:1.5}
  .num{font-family:var(--cond);font-stretch:82%;font-weight:800;font-size:.78rem;letter-spacing:.14em;color:var(--nl);text-transform:uppercase}
  .sec > h2{text-transform:uppercase}
  .tx{font-size:1rem;line-height:1.55;color:var(--ink2);margin:.4em 0 0}
  .tarj{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
  .tarj h3{font-size:1.14rem;font-weight:800;color:#fff;margin:0 0 .2em;line-height:1.2}
  .dato{display:block;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:.86rem;color:var(--ink);line-height:1.4}
  .dato b{font-family:var(--cond);font-stretch:82%;font-weight:700;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--nl);display:block;margin-bottom:3px}
  .dato a{color:var(--mute);font-size:.78rem}
  .tres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
  @media(max-width:900px){.tres{grid-template-columns:minmax(0,1fr)}}
  .col h3{font-family:var(--cond);font-stretch:82%;font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:.84rem;margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid var(--line2)}
  .col.propio h3{color:var(--nl);border-color:var(--nl-solid)}
  .col .it{margin:0 0 14px}
  .col .it b{display:block;color:#fff;font-size:1.02rem}
  .col .it span{display:block;color:var(--ink2);font-size:.92rem;line-height:1.45;margin-top:2px}
  .col .it i{display:block;font-style:normal;color:var(--mute);font-size:.82rem;margin-top:4px}
  .pilar{display:grid;grid-template-columns:64px minmax(0,1.15fr) minmax(0,.85fr);gap:22px;padding:24px 0;border-bottom:1px solid var(--line)}
  .pilar:first-child{border-top:1px solid var(--line)}
  @media(max-width:900px){.pilar{grid-template-columns:44px minmax(0,1fr)}.pilar .como{grid-column:2}}
  .pilar .n{font-family:var(--cond);font-stretch:82%;font-weight:800;font-size:2.4rem;line-height:.9;color:var(--nl)}
  .pilar h3{font-size:1.32rem;font-weight:800;color:#fff;margin:0 0 .3em;line-height:1.15}
  .pilar .como{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
  .pilar .como h4{font-family:var(--cond);font-stretch:82%;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0 0 8px;font-weight:700}
  .pilar .como ul{margin:0;padding-left:18px;font-size:.93rem;color:var(--ink);line-height:1.45}
  .pilar .como li{margin:5px 0}
  .ref{display:inline-block;font-family:var(--cond);font-stretch:82%;font-size:.74rem;font-weight:700;letter-spacing:.04em;color:var(--ink2);border:1px solid var(--line2);border-radius:3px;padding:2px 8px;margin:10px 6px 0 0;cursor:help}
  .ref.pr{color:#fff;background:var(--nl-solid);border-color:var(--nl-solid);cursor:default}
  .ref.of{color:var(--warn);border-color:rgba(240,192,64,.4);cursor:default}
  .aud{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:8px}
  .cuad{display:inline-block;font-family:var(--cond);font-stretch:82%;font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border-radius:3px;padding:3px 9px;margin-bottom:10px;background:rgba(255,255,255,.08);color:#fff}
  .cuad.retener,.cuad.retener-crecer{background:var(--nl-solid)}
  .cuad.conocer{background:#2f55d9}
  .cuad.movilizar{background:#1b8a5a}
  .cuad.no-gastar{background:#4a4f5c}
  .aud .donde{font-size:.84rem;color:var(--mute);margin:.2em 0 .6em}
  .aud .decir{font-size:.98rem;color:var(--ink);line-height:1.45}
  .relato .tarj h3{font-family:var(--cond);font-stretch:82%;letter-spacing:.1em;text-transform:uppercase;font-size:.84rem;color:var(--nl)}
  .relato .tarj p{font-size:1.04rem;line-height:1.5;color:var(--ink);margin:.5em 0 0}
  table.ag{width:100%;border-collapse:collapse;margin-top:8px}
  table.ag th{font-family:var(--cond);font-stretch:82%;text-align:left;font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line2)}
  table.ag td{vertical-align:top;padding:16px 14px;border-bottom:1px solid var(--line);font-size:.96rem;line-height:1.45;color:var(--ink2)}
  table.ag td.si{color:#fff;font-weight:700;width:22%}
  table.ag td.haz{color:var(--ink);width:32%}
  table.ag td.no{width:24%}
  table.ag td.dt{font-size:.84rem;color:var(--mute)}
  table.ag td.haz:before{content:'✓ ';color:var(--ok);font-weight:700}
  table.ag td.no:before{content:'✕ ';color:var(--nl);font-weight:700}
  @media(max-width:820px){table.ag,table.ag tbody,table.ag tr,table.ag td{display:block;width:auto!important}table.ag thead{display:none}table.ag tr{border-bottom:1px solid var(--line2);padding:10px 0}table.ag td{border:0;padding:5px 2px}}
  .fases{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:8px}
  .fase{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--line2);border-radius:var(--r);padding:16px 18px}
  .fase.hoy{border-top-color:var(--nl-solid);background:linear-gradient(180deg,rgba(194,10,0,.14),var(--card) 55%)}
  .fase .cu{font-family:var(--cond);font-stretch:82%;font-size:.74rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
  .fase.hoy .cu{color:var(--nl)}
  .fase h3{font-size:1.12rem;font-weight:800;color:#fff;margin:.2em 0 .3em}
  .fase p{margin:0 0 8px;font-size:.92rem;color:var(--ink2);line-height:1.45}
  .fase ul{margin:0;padding-left:17px;font-size:.88rem;color:var(--ink);line-height:1.4}
  .fase li{margin:4px 0}
  .dos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  @media(max-width:900px){.dos{grid-template-columns:minmax(0,1fr)}}
  .lista{list-style:none;margin:8px 0 0;padding:0}
  .lista li{padding:13px 0;border-bottom:1px solid var(--line);font-size:.95rem;line-height:1.45;color:var(--ink2)}
  .lista li b{color:#fff;display:block;margin-bottom:2px}
  .terr{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:8px}
  .terr .tarj ul{margin:10px 0 0;padding-left:17px;font-size:.9rem;color:var(--ink);line-height:1.4}
  .rutas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:8px}
  @media(max-width:900px){.rutas{grid-template-columns:minmax(0,1fr)}}
  .ruta{display:block;text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--nl-solid);border-radius:var(--r);padding:22px 24px;transition:transform .18s,border-color .18s}
  .ruta:hover{transform:translateY(-2px);border-color:var(--nl)}
  .ruta h3{font-size:1.4rem;font-weight:900;font-stretch:112%;text-transform:uppercase;color:#fff;margin:.2em 0 .4em}
  .ruta p{margin:0;color:var(--ink2);font-size:1rem;line-height:1.45}
  details.fu{margin-top:10px;border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;background:var(--card)}
  details.fu summary{cursor:pointer;font-weight:700;color:#fff}
  details.fu ol{margin:12px 0 0;padding-left:20px;font-size:.88rem;color:var(--ink2);line-height:1.5}
  details.fu li{margin:6px 0}
  details.fu li b{color:#fff}
  details.fu a{color:var(--ink2)}
  .adv{margin:14px 0 0;padding-left:18px;font-size:.86rem;color:var(--mute);line-height:1.5}
  .falta{padding:40px 0;color:var(--ink2);font-size:1.05rem}
  .conf-datos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:16px}
  @media(max-width:1000px){.conf-datos{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:560px){.conf-datos{grid-template-columns:minmax(0,1fr)}}
  .conf-datos .cd{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--nl-solid);border-radius:var(--r);padding:16px 18px}
  .conf-datos b{display:block;font-family:var(--cond);font-stretch:88%;font-weight:800;font-size:2rem;line-height:1;color:#fff}
  .conf-datos span{display:block;font-size:.9rem;line-height:1.4;color:var(--ink2);margin:8px 0}
  .conf-datos a{font-size:.78rem;color:var(--mute)}
  .fam{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}
  @media(max-width:900px){.fam{grid-template-columns:minmax(0,1fr)}}
  .fam .regla{background:var(--nl-solid);border-color:var(--nl-solid)}
</style>

<body>
<div id="nl-nav"></div>
<div class="wrap">
  <header class="hero">
    <div class="kick">05 · La estrategia · <span class="amb-rot"></span></div>
    <h1 id="frase">La estrategia</h1>
    <div class="eje" id="idea"></div>
  </header>
  <div id="cuerpo"></div>
  <div id="nl-pasos"></div>
  <footer class="pie">Propuesta de estrategia para discutir, elaborada con datos públicos y con el banco de literatura de Candidato 360. No tiene vínculo oficial con el partido ni promete resultados.</footer>
</div>
<script src="base.js?v=20261110i"></script>
<script>
(async function(){
  NL.nav('estrategia');
  const E=NL.esc, $=id=>document.getElementById(id);
  const PRIN={A1:'Posicionamiento y tema propio',A2:'Marco moral y metáfora',A3:'Emoción y narrativa',A4:'Contraste, no ataque',A5:'Movilizar más que persuadir',A6:'Datos y campaña permanente',A7:'Publicidad, crédito y posición',A8:'Digital como difusión'};
  const CUAD={retener:'Retener','retener-crecer':'Retener y crecer',conocer:'Hacerse conocer',movilizar:'Movilizar','no-gastar':'No gastar'};
  const MOD={inventario:['inventario.html','01 El inventario'],tablero:['tablero.html','02 El análisis'],clima:['clima.html','03 Dónde estamos'],escenarios:['escenarios.html','04 Reglas y escenarios'],encuesta:['clima.html','Encuestas · módulo 03']};
  const fecha=s=>{ if(!s) return ''; const [a,m,d]=s.split('-').map(Number); return d+' '+['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][m-1]+' '+a; };
  const cache={}; let CONF_REFS={};
  const trae=a=>cache[a]||(cache[a]=NL.dato('estrategia-'+a).catch(()=>null));

  function refs(D,ids,prin,oficio){
    const R=Object.fromEntries((D.refs||[]).map(r=>[r.id,r]));
    let h='';
    if(prin && PRIN[prin]) h+=`<span class="ref pr">${E(PRIN[prin])}</span>`;
    if(oficio) h+=`<span class="ref of">Criterio de oficio</span>`;
    (ids||[]).forEach(id=>{ const r=R[id]; if(r) h+=`<span class="ref" data-ref="${E(id)}">${E(r.corto||id)}</span>`; });
    return h;
  }
  const sec=(n,t,sub,cuerpo)=>`<section class="sec"><div class="num">${n}</div><h2 style="margin-top:.25em">${t}</h2>${sub?`<p class="sub">${sub}</p>`:''}${cuerpo}</section>`;

  async function pinta(){
    const amb=NL.ambito(), D=await trae(amb), c=$('cuerpo');
    if(!D){ $('frase').textContent='La estrategia'; $('idea').innerHTML=''; c.innerHTML='<p class="falta">Esta parte de la estrategia todavía está en redacción.</p>'; return; }
    $('frase').innerHTML=E(D.frase||'');
    $('idea').innerHTML=E(D.idea||'')+`<small>La estrategia es el eje: no cambia de aquí al 31 de octubre de 2027. Lo que cambia cada semana son las acciones, y salen de ella según lo que esté en la agenda.</small>`;
    let n=0, h='';
    const N=()=>String(++n).padStart(2,'0');

    if((D.por_que||[]).length) h+=sec(N(),'Por qué esta estrategia','La lectura de lo que muestran los cuatro módulos anteriores.',
      `<div class="grid g2">${D.por_que.map(p=>{ const m=MOD[p.mod]; return `<div class="tarj"><h3>${E(p.t)}</h3><p class="tx">${E(p.x)}</p><span class="dato"><b>El dato</b>${E(p.dato)}${m?` <a href="${m[0]}">· ${m[1]}</a>`:''}</span></div>`; }).join('')}</div>`);

    if(D.lugar){ const L=D.lugar, it=x=>`<div class="it"><b>${E(x.tema)}</b><span>${E(x.x)}</span>${x.dato?`<i>${E(x.dato)}</i>`:''}</div>`;
      h+=sec(N(),'El lugar que ocupa','Un partido gana cuando la conversación está en los temas que le creen. En los demás compite por credibilidad, no por propiedad.',
        `<p class="tx" style="max-width:76ch;font-size:1.06rem;color:var(--ink)">${E(L.x)}</p><div>${refs(D,L.refs,'A1')}</div>
         <div class="tres"><div class="col propio"><h3>Temas propios</h3>${(L.propios||[]).map(it).join('')}</div>
         <div class="col"><h3>Temas de consenso: ser creíble</h3>${(L.consenso||[]).map(it).join('')}</div>
         <div class="col"><h3>Lo que no disputa</h3>${(L.ceder||[]).map(it).join('')}</div></div>`); }

    const CF=await trae('confianza'), K=CF&&CF.ambitos&&CF.ambitos[amb];
    if(K){ const RC=Object.fromEntries((CF.refs||[]).map(r=>[r.id,r])), D2={refs:CF.refs};
      h+=sec(N(),K.titulo,'Sin confianza no hay estrategia que funcione. Esto es lo que dicen las encuestas y cómo se construye.',
        `<p class="tx" style="max-width:78ch;font-size:1.08rem;color:var(--ink)">${E(K.diagnostico)}</p>
         ${amb==='general'?`<div class="conf-datos">${CF.datos.map(d=>`<div class="cd"><b>${E(d.cifra)}</b><span>${E(d.dato)}</span><a href="${E(d.url)}" target="_blank" rel="noopener">${E(d.fuente)}</a></div>`).join('')}</div>`+
           (K.outsider?`<p class="nota" style="margin-top:10px">${E(K.outsider.x)} <a href="${E(K.outsider.url)}" target="_blank" rel="noopener" style="color:var(--ink2)">${E(K.outsider.fuente)}</a></p>`:''):''}
         ${K.familia?`<div class="fam"><div class="tarj"><div class="num" style="color:var(--ok)">El activo</div><p class="tx">${E(K.familia.activo)}</p></div>
           <div class="tarj"><div class="num">El riesgo</div><p class="tx">${E(K.familia.riesgo)}</p></div>
           <div class="tarj regla"><div class="num" style="color:#fff">La regla</div><p class="tx" style="color:#fff">${E(K.familia.regla)}</p></div></div>`:''}
         <div style="margin-top:8px">${K.palancas.map((p,i)=>`<div class="pilar"><div class="n">${String(i+1).padStart(2,'0')}</div><div><h3>${E(p.t)}</h3><p class="tx">${E(p.x)}</p>${p.dato?`<span class="dato" style="max-width:62ch"><b>El dato</b>${E(p.dato)}</span>`:''}<div>${refs(D2,p.refs,null,p.oficio)}</div></div>
           <div class="como"><h4>Cómo se hace</h4><ul>${(p.como||[]).map(x=>`<li>${E(x)}</li>`).join('')}</ul></div></div>`).join('')}</div>
         ${(K.no||[]).length?`<div class="tarj" style="margin-top:16px"><div class="num">Lo que no hay que hacer</div><ul class="lista">${K.no.map(x=>`<li>${E(x)}</li>`).join('')}</ul></div>`:''}`);
      CONF_REFS=RC; }

    if((D.pilares||[]).length) h+=sec(N(),'Los pilares','Lo que sostiene la estrategia durante el año. Cada uno dice de qué principio sale.',
      `<div>${D.pilares.map((p,i)=>`<div class="pilar"><div class="n">${String(i+1).padStart(2,'0')}</div><div><h3>${E(p.t)}</h3><p class="tx">${E(p.x)}</p><div>${refs(D,p.refs,p.principio,p.oficio)}</div></div>
        <div class="como"><h4>Cómo se hace</h4><ul>${(p.como||[]).map(x=>`<li>${E(x)}</li>`).join('')}</ul></div></div>`).join('')}</div>`);

    if((D.territorios||[]).length) h+=sec(N(),'Dónde concentrar','Los territorios, clasificados por lo que conviene hacer en cada uno.',
      `<div class="terr">${D.territorios.map(t=>`<div class="tarj"><span class="cuad ${t.grupo==='Retener'?'retener':t.grupo==='Crecer'?'conocer':t.grupo==='Abrir'?'movilizar':'no-gastar'}">${E(t.grupo)}</span><p class="tx" style="margin:0">${E(t.x)}</p><ul>${(t.lugares||[]).map(x=>`<li>${E(x)}</li>`).join('')}</ul></div>`).join('')}</div>`);

    if((D.audiencias||[]).length) h+=sec(N(),'A quién le habla','No a todos se les dice lo mismo ni se les busca igual.',
      `<div class="aud">${D.audiencias.map(a=>`<div class="tarj"><span class="cuad ${E(a.cuadrante)}">${E(CUAD[a.cuadrante]||a.cuadrante||'')}</span><h3>${E(a.quien)}</h3><div class="donde">${E(a.donde)}</div><div class="decir">${E(a.decir)}</div><div>${refs(D,a.refs)}</div></div>`).join('')}</div>`);

    if(D.relato) h+=sec(N(),'El relato','La historia que se repite todo el año: quién habla, a quiénes reúne y por qué ahora.',
      `<div class="tres relato"><div class="tarj"><h3>Quién habla</h3><p>${E(D.relato.yo)}</p></div><div class="tarj"><h3>A quiénes reúne</h3><p>${E(D.relato.nosotros)}</p></div><div class="tarj"><h3>Por qué ahora</h3><p>${E(D.relato.ahora)}</p></div></div><div>${refs(D,D.relato.refs,'A3')}</div>`);

    if((D.contraste||[]).length) h+=sec(N(),'Frente a quién se distingue','Con hechos y sin ataque: el ataque no rinde más y se devuelve.',
      `<ul class="lista">${D.contraste.map(x=>`<li><b>Frente a ${E(x.frente)}</b>${E(x.x)}</li>`).join('')}</ul>`);

    if((D.agenda||[]).length) h+=sec(N(),'De la estrategia a la semana','La estrategia no cambia; las acciones sí. Esto es lo que se hace según lo que esté en la prensa.',
      `<table class="ag"><thead><tr><th>Si la agenda está en</th><th>Qué hacer</th><th>Qué no hacer</th><th>Lo que dicen los datos</th></tr></thead><tbody>${D.agenda.map(a=>`<tr><td class="si">${E(a.si)}</td><td class="haz">${E(a.haz)}</td><td class="no">${E(a.no)}</td><td class="dt">${E(a.dato||'')}</td></tr>`).join('')}</tbody></table>`);

    if((D.fases||[]).length){ const hoy=new Date().toISOString().slice(0,10);
      h+=sec(N(),'Las fases hasta octubre de 2027','El mismo eje, con un foco distinto en cada tramo del calendario.',
        `<div class="fases">${D.fases.map(f=>{ const on=(!f.desde||f.desde<=hoy)&&(!f.hasta||hoy<=f.hasta); return `<div class="fase ${on?'hoy':''}"><div class="cu">${on?'Ahora · ':''}${f.desde?fecha(f.desde):'Hoy'}${f.hasta?' a '+fecha(f.hasta):''}</div><h3>${E(f.fase)}</h3><p>${E(f.foco)}</p><ul>${(f.acciones||[]).map(x=>`<li>${E(x)}</li>`).join('')}</ul></div>`; }).join('')}</div>`); }

    if((D.riesgos||[]).length || (D.medir||[]).length) h+=sec(N(),'Riesgos y cómo saber si funciona','',
      `<div class="dos"><div><h3 class="num" style="font-size:.8rem">Riesgos</h3><ul class="lista">${(D.riesgos||[]).map(x=>`<li><b>${E(x.r)}</b>${E(x.manejo)}</li>`).join('')}</ul></div>
       <div><h3 class="num" style="font-size:.8rem">Cómo medir el avance</h3><ul class="lista">${(D.medir||[]).map(x=>`<li><b>${E(x.que)}</b>${E(x.como)}</li>`).join('')}</ul></div></div>`);

    if(amb==='general'){ const [B,R]=await Promise.all([trae('bogota'),trae('resto')]);
      h+=sec(N(),'Dos rutas con el mismo eje','La estrategia general se baja distinto en la capital y en las regiones.',
        `<div class="rutas">${[['bogota','Bogotá',B],['resto','Resto del país',R]].map(([k,t,X])=>`<button type="button" class="ruta" data-ir="${k}"><div class="num">Ruta · ${t}</div><h3>${E(X?X.frase:t)}</h3><p>${E(X?X.idea:'En redacción.')}</p></button>`).join('')}</div>`); }

    h+=`<section class="sec"><div class="num">De dónde sale</div><h2 style="margin-top:.25em">Fuentes y límites</h2>
      <p class="sub">Cada pilar cita un principio del banco de estrategia de Candidato 360 y sus referencias. Lo que no sale de ahí va marcado como criterio de oficio.</p>
      <details class="fu"><summary>Referencias usadas (${(D.refs||[]).length})</summary><ol>${(D.refs||[]).map(r=>`<li><b>${E(r.corto||r.id)}.</b> ${E(r.texto||'')}${r.doi?` <a href="${E(r.doi)}" target="_blank" rel="noopener">${E(r.doi.replace('https://doi.org/','doi:'))}</a>`:''}</li>`).join('')}</ol></details>
      <ul class="adv">${(D.advertencias||[]).map(x=>`<li>${E(x)}</li>`).join('')}</ul></section>`;
    c.innerHTML=h;
  }
  /* referencia completa al pasar sobre la etiqueta */
  document.addEventListener('mousemove', async ev=>{ const r=ev.target.closest && ev.target.closest('.ref[data-ref]'); if(!r){ NL.tip(null); return; }
    const D=await trae(NL.ambito()); const x=(D&&D.refs||[]).find(y=>y.id===r.dataset.ref)||CONF_REFS[r.dataset.ref]; if(x) NL.tip(`<b>${E(x.corto||x.id)}</b><div class="m" style="margin-top:4px">${E(x.texto||'')}</div>`, ev); });
  document.addEventListener('click', ev=>{ const b=ev.target.closest && ev.target.closest('[data-ir]'); if(b){ NL.setAmbito(b.dataset.ir); scrollTo({top:0}); } });
  NL.alCambiarAmbito(()=>pinta());
  await pinta();
})().catch(e=>{ document.body.insertAdjacentHTML('beforeend','<pre style="color:#f66;padding:20px">'+e.stack+'</pre>'); });
</script>
</body>
</html>
