name: Ley de Rescate · rastreo diario

# Corre a diario a las 06:15 de Bogotá (11:15 UTC). Lee la ficha oficial de la Cámara, los
# órdenes del día, la prensa y las redes; clasifica con DeepSeek y deja estado.json en
# ley-rescate-data/, que sirve GitHub Pages a ley-de-rescate-avance.html.
# Doc: tools/ley-rescate/LEEME.md
#
# El estado privado (corpus con comentarios de personas, clasificación) NO va al repo:
# viaja como artefacto de una corrida a la siguiente (se guarda 90 días; cada corrida lo
# renueva). Si se pierde, el rastreo arranca de cero y solo pierde el histórico.
#
# Secretos: APIFY_TOKEN · DEEPSEEK_API_KEY
# Variables opcionales: LR_TOPE_USD (por corrida, 1.5) · LR_TOPE_MES_USD (45) · LR_REDES=off apaga Apify
on:
  schedule:
    - cron: '15 11 * * *'
  workflow_dispatch:
    inputs:
      sin_redes:
        description: 'Saltar Apify (no gasta)'
        type: boolean
        default: false
      tope_usd:
        description: 'Tope en dólares de esta corrida en Apify'
        type: string
        default: ''
      dias:
        description: 'Días de prensa hacia atrás'
        type: string
        default: '3'

permissions:
  contents: write
  actions: read

concurrency:
  group: ley-rescate
  cancel-in-progress: false

env:
  LR_DATOS: ${{ github.workspace }}/.lr
  GH_TOKEN: ${{ github.token }}

jobs:
  rastreo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Traer el estado de la corrida anterior
        run: |
          mkdir -p "$LR_DATOS"
          id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=ley-rescate-estado&per_page=20" \
               --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')
          if [ -z "$id" ]; then echo "Sin estado anterior: arranca de cero."; exit 0; fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > estado.zip
          unzip -o -q estado.zip -d "$LR_DATOS" && rm estado.zip
          ls -la "$LR_DATOS"

      - name: Leer redes
        if: ${{ !inputs.sin_redes && vars.LR_REDES != 'off' }}
        continue-on-error: true
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          LR_TOPE_USD: ${{ inputs.tope_usd || vars.LR_TOPE_USD }}
          LR_TOPE_MES_USD: ${{ vars.LR_TOPE_MES_USD }}
        run: node tools/ley-rescate/redes.mjs

      - name: Rastrear, clasificar y publicar
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 tools/ley-rescate/rastreo.py --publicar --dias "${{ inputs.dias || '3' }}"

      - name: Guardar el estado para la próxima corrida
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ley-rescate-estado
          path: |
            .lr/*.json
            !.lr/*.tmp
          retention-days: 90
          if-no-files-found: warn

      - name: Dejar estado.json en el repo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ley-rescate-data/estado.json
          if git diff --cached --quiet; then echo 'Sin cambios.'; exit 0; fi
          git commit -m "ley de rescate: seguimiento $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
