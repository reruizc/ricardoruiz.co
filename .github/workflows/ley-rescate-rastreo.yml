name: Ley de Rescate · rastreo diario

# Corre a diario a las 06:15 de Bogotá (11:15 UTC). Lee la ficha oficial de la Cámara, los
# órdenes del día, la prensa y las redes; clasifica con DeepSeek y publica el JSON que pinta
# ley-de-rescate-avance.html. Doc: tools/ley-rescate/LEEME.md
#
# Secretos: APIFY_TOKEN · DEEPSEEK_API_KEY · RR_S3_KEY_ID · RR_S3_SECRET
# Variables opcionales: LR_TOPE_USD (por corrida, 1.5) · LR_TOPE_MES_USD (45) · LR_REDES=off apaga Apify
on:
  schedule:
    - cron: '15 11 * * *'
  workflow_dispatch:
    inputs:
      sin_redes:
        description: 'Saltar Apify (no gasta)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ley-rescate
  cancel-in-progress: false

env:
  LR_DATOS: ${{ github.workspace }}/.lr
  ESTADO_S3: s3://elecciones-2026/ricardoruiz.co/ley-rescate-privado
  AWS_ACCESS_KEY_ID: ${{ secrets.RR_S3_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.RR_S3_SECRET }}
  AWS_DEFAULT_REGION: us-east-1

jobs:
  rastreo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # El corpus guarda comentarios de personas: vive en un prefijo PRIVADO, nunca en el repo.
      - name: Traer el estado anterior
        run: |
          mkdir -p "$LR_DATOS"
          aws s3 cp "$ESTADO_S3/" "$LR_DATOS/" --recursive --only-show-errors

      - name: Leer redes
        if: ${{ !inputs.sin_redes && vars.LR_REDES != 'off' }}
        continue-on-error: true
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          LR_TOPE_USD: ${{ vars.LR_TOPE_USD }}
          LR_TOPE_MES_USD: ${{ vars.LR_TOPE_MES_USD }}
        run: node tools/ley-rescate/redes.mjs

      - name: Rastrear, clasificar y publicar
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 tools/ley-rescate/rastreo.py --subir

      - name: Guardar el estado
        if: ${{ always() }}
        run: aws s3 cp "$LR_DATOS/" "$ESTADO_S3/" --recursive --exclude "*.tmp" --exclude "*.gz" --only-show-errors
