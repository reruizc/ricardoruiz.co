<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta name="description" content="Quién ha dicho qué sobre la Ley de Rescate: congresistas, gobierno, gremios, sindicatos y expertos." />

  <meta property="og:title" content="Las voces · Ley de Rescate · Caudal × Cauce" />
  <meta property="og:description" content="Quién ha dicho qué sobre la Ley de Rescate: congresistas, gobierno, gremios, sindicatos y expertos." />
  <meta property="og:image" content="https://ricardoruiz.co/imagenes-index/proyectos/legislativo.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link rel="stylesheet" href="ley-rescate-base.css?v=20261102" />
  <script defer src="/track.js"></script>
</head>
<body>
  <main class="wrap">
    <div class="k">Ley de Rescate · PL 477 de 2026 Cámara</div>
    <h1>Quién ha dicho qué</h1>
    <p class="lead">Declaraciones verificadas una por una, con su fuente. Hablan por sí mismas, no necesariamente por su bancada.</p>
    <div id="app" hidden>
      <div class="fil"><div class="pills" id="f-voz"></div><input class="q" id="q" type="search" placeholder="Buscar una persona o bancada…" aria-label="Buscar voz" /></div>
      <div class="voces" id="lvoces"></div>
    </div>
    <div id="carga">Cargando el seguimiento…</div>
  </main>
  <script src="ley-rescate-base.js?v=20261102"></script>
  <script>
LR.pagina('voces', E => {
  const { $, esc, cara, P } = LR, F = [['todos', 'Todas'], ['r', 'Rechazan'], ['m', 'Con reparos'], ['a', 'Apoyan'], ['i', 'Sin definir']], C = { a: 'vA', r: 'vR', m: 'vM', i: '' }; let f = 'todos';
  const sin = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  function pinta() { const q = sin($('#q').value || '');
    $('#f-voz').innerHTML = F.map(([k, t]) => `<button class="pill ${f === k ? 'on' : ''}" data-v="${k}">${t}</button>`).join('');
    const L = E.voces.filter(v => (f === 'todos' || v.p === f) && sin(`${v.q} ${v.c} ${v.b}`).includes(q));
    $('#lvoces').innerHTML = L.map(v => `<article class="voz ${C[v.p]}">${cara(E, v.s, v.q, v.org)}<div><b>${esc(v.q)}<span class="et-p" style="color:${P[v.p][1]}">${P[v.p][0]}</span></b><small>${esc(v.c)} · ${esc(v.b)}</small><p>${esc(v.x)}</p>${v.u ? `<a href="${esc(v.u)}" target="_blank" rel="noopener">${esc(v.f)}</a>` : `<small>${esc(v.f)}</small>`}</div></article>`).join('') || '<p class="vacio">Nadie coincide con esa búsqueda.</p>';
    document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { f = b.dataset.v; pinta(); }); }
  $('#q').oninput = pinta; pinta();
});
  </script>
</body>
</html>
