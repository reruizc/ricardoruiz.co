<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Gastos</title>
<link rel="manifest" href="gastos-manifest.json">
<link rel="apple-touch-icon" href="imagenes/gastos-icon-180.png">
<link rel="icon" href="imagenes/gastos-icon-192.png">
<meta name="theme-color" content="#060810">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gastos">
<style>
@font-face { font-family:'HelveticaNeue'; src:url('fonts/helveticaneue-light.woff2') format('woff2'); font-weight:300; font-display:swap; }
@font-face { font-family:'HelveticaNeue'; src:url('fonts/helveticaneue.woff2') format('woff2'); font-weight:400; font-display:swap; }
@font-face { font-family:'HelveticaNeue'; src:url('fonts/helveticaneue-medium.woff2') format('woff2'); font-weight:500; font-display:swap; }
@font-face { font-family:'HelveticaNeue'; src:url('fonts/helveticaneue-bold.woff2') format('woff2'); font-weight:600 900; font-display:swap; }

:root{
  --paper:#060810; --paper-2:#10141f; --paper-3:#161b29;
  --ink:#f4f3ef; --ink-2:#b6bac6; --ink-3:#7e8494;
  --rule:rgba(244,243,239,.1); --rule-strong:rgba(244,243,239,.22);
  --accent:#3d6fff; --blue:#0047FF; --green:#4ade80; --gold:#e6cf3a;
  --danger:#ff5c5c; --orange:#f97316;
  --sans:'HelveticaNeue',Helvetica,Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.5;min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-tap-highlight-color:transparent;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(60% 40% at 15% 0%, rgba(0,71,255,.16), transparent 70%),
    radial-gradient(50% 35% at 95% 8%, rgba(61,111,255,.10), transparent 70%);
}
.wrap{max-width:640px;margin:0 auto;padding:0 1.1rem 5rem}

/* ── Barra ── */
.top{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:1rem 0 .8rem}
.brand{font-size:1.05rem;font-weight:600;letter-spacing:-.01em}
.brand small{display:block;font-size:.7rem;font-weight:400;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.mes-nav{display:flex;align-items:center;gap:.35rem}
.mes-nav button{
  background:var(--paper-2);border:1px solid var(--rule);color:var(--ink-2);
  width:32px;height:32px;border-radius:8px;font-size:1rem;cursor:pointer;
}
.mes-nav button:disabled{opacity:.3}
.mes-lbl{font-size:.85rem;color:var(--ink-2);min-width:88px;text-align:center;font-weight:500}

/* ── Tarjeta principal ── */
.hero{
  background:linear-gradient(160deg,var(--paper-3),var(--paper-2));
  border:1px solid var(--rule);border-radius:16px;padding:1.3rem 1.2rem;margin-bottom:.9rem;
}
.hero .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.hero .big{font-size:2.5rem;font-weight:600;letter-spacing:-.03em;line-height:1.1;margin:.2rem 0 .1rem;font-variant-numeric:tabular-nums}
.hero .big.neg{color:var(--danger)}
.hero .sub{font-size:.85rem;color:var(--ink-2)}
.bar{height:8px;background:rgba(244,243,239,.08);border-radius:99px;overflow:hidden;margin:.9rem 0 .5rem}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.bar i.warn{background:var(--gold)} .bar i.over{background:var(--danger)}
.hero-foot{display:flex;justify-content:space-between;font-size:.78rem;color:var(--ink-3)}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:.9rem}
.kpi{background:var(--paper-2);border:1px solid var(--rule);border-radius:12px;padding:.75rem .6rem;text-align:center}
.kpi .n{font-size:1.05rem;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .l{font-size:.66rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;margin-top:.15rem}

h2{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:500;margin:1.4rem 0 .6rem}

/* ── Categorías ── */
.cat{display:flex;align-items:center;gap:.65rem;padding:.5rem 0;border-bottom:1px solid var(--rule)}
.cat-n{flex:1;font-size:.9rem}
.cat-bar{width:74px;height:5px;background:rgba(244,243,239,.08);border-radius:99px;overflow:hidden}
.cat-bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.cat-v{font-size:.85rem;font-variant-numeric:tabular-nums;min-width:78px;text-align:right;color:var(--ink-2)}

/* ── Movimientos ── */
.mov{
  background:var(--paper-2);border:1px solid var(--rule);border-radius:12px;
  padding:.7rem .85rem;margin-bottom:.45rem;cursor:pointer;
}
.mov.rev{border-color:rgba(230,207,58,.32)}
.mov-top{display:flex;align-items:baseline;gap:.6rem}
.mov-com{flex:1;font-size:.92rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mov-monto{font-size:.95rem;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.mov-monto.in{color:var(--green)}
.mov-monto.tr{color:var(--ink-3);font-weight:400}
.mov-sub{display:flex;gap:.45rem;align-items:center;font-size:.72rem;color:var(--ink-3);margin-top:.2rem;flex-wrap:wrap}
.tag{background:rgba(244,243,239,.07);border-radius:5px;padding:.08rem .38rem;font-size:.68rem}
.tag.rev{background:rgba(230,207,58,.16);color:var(--gold)}
.tag.fijo{background:rgba(61,111,255,.16);color:var(--accent)}

/* ── Editor ── */
.edit{margin-top:.7rem;padding-top:.7rem;border-top:1px solid var(--rule);display:grid;gap:.5rem}
.edit label{font-size:.7rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
input,select{
  width:100%;background:var(--paper);border:1px solid var(--rule-strong);color:var(--ink);
  border-radius:9px;padding:.55rem .65rem;font-family:var(--sans);font-size:.95rem;
}
input:focus,select:focus{outline:none;border-color:var(--accent)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.crudo{font-size:.72rem;color:var(--ink-3);background:var(--paper);border-radius:8px;padding:.5rem;line-height:1.4;word-break:break-word}
.acts{display:flex;gap:.5rem;margin-top:.2rem}
button.b{
  flex:1;border:none;border-radius:9px;padding:.6rem;font-family:var(--sans);
  font-size:.88rem;font-weight:500;cursor:pointer;background:var(--blue);color:#fff;
}
button.b.ghost{background:transparent;border:1px solid var(--rule-strong);color:var(--ink-2)}
button.b.del{background:transparent;border:1px solid rgba(255,92,92,.4);color:var(--danger);flex:0 0 auto;padding:.6rem .9rem}

.fab{
  position:fixed;right:max(1.1rem,env(safe-area-inset-right));
  bottom:calc(1.1rem + env(safe-area-inset-bottom));
  width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;
  border:none;font-size:1.7rem;line-height:1;cursor:pointer;
  box-shadow:0 6px 24px rgba(0,71,255,.4);z-index:50;
}
.nota{font-size:.78rem;color:var(--ink-3);background:var(--paper-2);border:1px solid var(--rule);border-radius:10px;padding:.6rem .75rem;margin-bottom:.6rem;line-height:1.45}
.empty{text-align:center;color:var(--ink-3);font-size:.88rem;padding:2rem 1rem;line-height:1.6}
.gate{position:fixed;inset:0;background:var(--paper);display:grid;place-items:center;z-index:100;padding:2rem;text-align:center}
.gate p{color:var(--ink-2);font-size:.95rem;margin-top:.6rem}
.gate a{color:var(--accent)}
.sheet{position:fixed;inset:0;background:rgba(6,8,16,.86);z-index:80;display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet-in{background:var(--paper-2);border-top:1px solid var(--rule-strong);border-radius:18px 18px 0 0;padding:1.2rem 1.1rem calc(1.4rem + env(safe-area-inset-bottom));width:100%;max-width:640px;margin:0 auto;display:grid;gap:.6rem}
.sheet-in h3{font-size:1rem;font-weight:600;margin-bottom:.2rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(5.5rem + env(safe-area-inset-bottom));background:var(--paper-3);border:1px solid var(--rule-strong);border-radius:10px;padding:.6rem 1rem;font-size:.85rem;z-index:90;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>

<div class="gate" id="gate"><div>
  <div class="brand" style="font-size:1.4rem">Gastos</div>
  <p id="gate-msg">Verificando…</p>
</div></div>

<div class="wrap" id="app" hidden>
  <div class="top">
    <div class="brand">Gastos<small id="sueldo-lbl">—</small></div>
    <div class="mes-nav">
      <button id="prev" aria-label="Mes anterior">‹</button>
      <span class="mes-lbl" id="mes-lbl">—</span>
      <button id="next" aria-label="Mes siguiente">›</button>
    </div>
  </div>

  <div class="hero">
    <div class="lbl" id="hero-lbl">Disponible</div>
    <div class="big" id="hero-big">—</div>
    <div class="sub" id="hero-sub"></div>
    <div class="bar"><i id="hero-bar" style="width:0"></i></div>
    <div class="hero-foot"><span id="foot-l"></span><span id="foot-r"></span></div>
  </div>

  <div class="kpis">
    <div class="kpi"><div class="n" id="k-dia">—</div><div class="l">Por día</div></div>
    <div class="kpi"><div class="n" id="k-queda">—</div><div class="l">Al día</div></div>
    <div class="kpi"><div class="n" id="k-mov">—</div><div class="l">Movs.</div></div>
  </div>

  <div id="fijo-aviso"></div>
  <div id="tras-aviso"></div>
  <div id="rev-aviso"></div>

  <h2>En qué se va</h2>
  <div id="cats"></div>

  <h2 id="movs-h">Movimientos</h2>
  <div id="movs"></div>
</div>

<button class="fab" id="fab" hidden>+</button>

<div class="sheet" id="sheet"><div class="sheet-in">
  <h3 id="sheet-t">Anotar gasto</h3>
  <div id="sheet-body"></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://rr-auth.reruizc.workers.dev';
const PERMITIDOS = ['reruizc@gmail.com'];
const CATS = ['mercado','comida','transporte','suscripciones','servicios','salud','hogar','ropa',
              'educacion','entretenimiento','transferencia','impuestos','financiero','traslado','sin categoría','otro'];
let TOKEN = localStorage.getItem('rr-token') || '';
let MES = null, DATA = null, ABIERTO = null, CFG = {};

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cop = n => '$' + Math.round(Number(n)||0).toLocaleString('es-CO');
const corto = n => {
  n = Math.round(Number(n)||0);
  if (Math.abs(n) >= 1e6) return '$' + (n/1e6).toFixed(1).replace('.0','') + 'M';
  if (Math.abs(n) >= 1000) return '$' + Math.round(n/1000) + 'k';
  return '$' + n;
};
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function mesLbl(m){ const [a,b] = m.split('-'); return `${MESES[Number(b)-1]} ${a}`; }
function mesHoy(){ const d = new Date(Date.now() - 5*3600000); return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}`; }
function mesSuma(m, n){
  let [a,b] = m.split('-').map(Number); b += n;
  while (b > 12){ b -= 12; a++; } while (b < 1){ b += 12; a--; }
  return `${a}-${String(b).padStart(2,'0')}`;
}
let toastT;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('on'), 2200); }

async function api(ruta, opts = {}){
  const r = await fetch(API + ruta, {
    ...opts,
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + TOKEN, ...(opts.headers||{}) }
  });
  const j = await r.json().catch(()=>({ok:false,error:'respuesta ilegible'}));
  if (!r.ok || j.ok === false) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

// ── Gate ──
async function arrancar(){
  if (!TOKEN){ return negar('Necesitas iniciar sesión.', true); }
  let u = null;
  try { u = (await (await fetch(API + '/auth/me', { headers:{ Authorization:'Bearer ' + TOKEN } })).json()).user; } catch {}
  const correo = (u && u.email || '').toLowerCase();
  if (!correo) return negar('Tu sesión expiró.', true);
  if (!PERMITIDOS.includes(correo)) return negar('Esta herramienta es privada.', false);
  $('gate').remove(); $('app').hidden = false; $('fab').hidden = false;
  MES = mesHoy();
  try { CFG = (await api('/gastos/config')).cfg || {}; } catch {}
  cargar();
}
function negar(msg, login){
  $('gate-msg').innerHTML = esc(msg) + (login ? ' <a href="login.html?next=gastos.html">Entrar →</a>' : ' <a href="index.html">Inicio →</a>');
}

// ── Carga y render ──
async function cargar(){
  $('mes-lbl').textContent = mesLbl(MES);
  $('next').disabled = MES >= mesHoy();
  try {
    DATA = await api('/gastos/resumen?mes=' + MES);
  } catch (e) { toast('No cargó: ' + e.message); return; }
  render();
}

function render(){
  const d = DATA;
  $('sueldo-lbl').textContent = d.sueldo ? 'sueldo ' + corto(d.sueldo) : 'sin sueldo · toca aquí';

  const hayS = d.sueldo > 0;
  $('hero-lbl').textContent = hayS ? 'Disponible este mes' : 'Gastado este mes';
  const val = hayS ? d.disponible : d.total_gastado;
  const big = $('hero-big');
  big.textContent = cop(val);
  big.classList.toggle('neg', hayS && val < 0);

  const pct = hayS ? Math.min(100, (d.total_gastado / d.sueldo) * 100) : 0;
  const bar = $('hero-bar');
  bar.style.width = (hayS ? pct : 0) + '%';
  bar.className = pct >= 100 ? 'over' : pct >= 80 ? 'warn' : '';

  $('hero-sub').textContent = hayS
    ? `Llevas ${cop(d.total_gastado)} de ${cop(d.sueldo)}`
    : 'Define tu sueldo para ver cuánto te queda';
  $('foot-l').textContent = hayS ? Math.round(pct) + '% usado' : `${d.n_movimientos} movimientos`;
  $('foot-r').textContent = d.total_ingreso ? 'Ingresos ' + cop(d.total_ingreso) : '';
  $('fijo-aviso').innerHTML = d.n_recurrentes
    ? `<div class="nota">↻ ${cop(d.total_recurrente)} del mes es gasto fijo (${d.n_recurrentes} ${d.n_recurrentes===1?'cobro que se repite':'cobros que se repiten'} solos).</div>`
    : '';
  $('tras-aviso').innerHTML = d.n_traslados
    ? `<div class="nota">⇄ ${d.n_traslados} ${d.n_traslados===1?'traslado':'traslados'} por ${cop(d.total_traslados)} — plata movida entre cuentas tuyas, no suma a los totales.</div>`
    : '';

  $('k-dia').textContent   = corto(d.promedio_dia);
  $('k-queda').textContent = d.disponible_por_dia != null ? corto(d.disponible_por_dia) : '—';
  $('k-mov').textContent   = d.n_movimientos;

  $('rev-aviso').innerHTML = d.n_por_revisar
    ? `<div class="empty" style="padding:.7rem;background:rgba(230,207,58,.08);border:1px solid rgba(230,207,58,.25);border-radius:10px;color:var(--gold);font-size:.82rem">
         ${d.n_por_revisar} ${d.n_por_revisar===1?'movimiento leído':'movimientos leídos'} con dudas. Tócalos para corregir.</div>`
    : '';

  const max = d.por_categoria.length ? d.por_categoria[0].monto : 1;
  $('cats').innerHTML = d.por_categoria.length
    ? d.por_categoria.map(c => `
        <div class="cat">
          <span class="cat-n">${esc(c.categoria)}</span>
          <span class="cat-bar"><i style="width:${Math.max(4,(c.monto/max)*100)}%"></i></span>
          <span class="cat-v">${cop(c.monto)}</span>
        </div>`).join('')
    : '<div class="empty">Todavía no hay gastos este mes.</div>';

  $('movs-h').textContent = `Movimientos · ${d.n_movimientos}`;
  $('movs').innerHTML = d.movimientos.length
    ? d.movimientos.map(movHTML).join('')
    : `<div class="empty">Nada registrado.<br>Cuando llegue un SMS del banco, aparecerá aquí solo.</div>`;
}

function movHTML(m){
  const dudoso = !m.revisado && m.confianza !== 'alta';
  const f = new Date(m.ts - 5*3600000);
  const fecha = `${f.getUTCDate()} ${MESES[f.getUTCMonth()].slice(0,3)}`;
  const abierto = ABIERTO === m.id;
  return `
  <div class="mov ${dudoso?'rev':''}" data-id="${esc(m.id)}">
    <div class="mov-top">
      <span class="mov-com">${esc(m.comercio)}</span>
      <span class="mov-monto ${m.tipo==='ingreso'?'in':m.tipo==='traslado'?'tr':''}">${m.tipo==='ingreso'?'+':m.tipo==='traslado'?'⇄ ':''}${cop(m.monto)}</span>
    </div>
    <div class="mov-sub">
      <span>${fecha}</span><span class="tag">${esc(m.categoria)}</span>
      <span class="tag">${esc(m.banco)}</span>
      ${m.recurrente ? '<span class="tag fijo">↻ fijo</span>' : ''}
      ${dudoso ? '<span class="tag rev">revisar</span>' : ''}
    </div>
    ${abierto ? editorHTML(m) : ''}
  </div>`;
}

function editorHTML(m){
  return `
  <div class="edit" data-edit="${esc(m.id)}">
    <div class="row">
      <div><label>Monto</label><input type="number" inputmode="decimal" data-f="monto" value="${Number(m.monto)}"></div>
      <div><label>Tipo</label><select data-f="tipo">
        <option value="gasto"${m.tipo==='gasto'?' selected':''}>Gasto</option>
        <option value="ingreso"${m.tipo==='ingreso'?' selected':''}>Ingreso</option>
        <option value="traslado"${m.tipo==='traslado'?' selected':''}>Traslado (no cuenta)</option>
      </select></div>
    </div>
    <div><label>Comercio</label><input data-f="comercio" value="${esc(m.comercio)}"></div>
    <div><label>Categoría</label><select data-f="categoria">
      ${CATS.map(c=>`<option${c===m.categoria?' selected':''}>${esc(c)}</option>`).join('')}
    </select></div>
    ${m.crudo ? `<div><label>Mensaje original</label><div class="crudo">${esc(m.crudo)}</div></div>` : ''}
    <div class="acts">
      <button class="b" data-a="guardar">Guardar</button>
      <button class="b del" data-a="borrar">Borrar</button>
    </div>
  </div>`;
}

// ── Interacción ──
$('movs').addEventListener('click', async e => {
  const btn = e.target.closest('button[data-a]');
  if (btn){
    e.stopPropagation();
    const caja = btn.closest('[data-edit]');
    const id = caja.dataset.edit;
    if (btn.dataset.a === 'borrar'){
      if (!confirm('¿Borrar este movimiento?')) return;
      try { await api('/gastos/editar', { method:'POST', body: JSON.stringify({ id, mes: MES, borrar:true }) });
            ABIERTO = null; toast('Borrado'); cargar(); }
      catch (err) { toast('No se borró: ' + err.message); }
      return;
    }
    const g = f => caja.querySelector(`[data-f="${f}"]`).value;
    try {
      await api('/gastos/editar', { method:'POST', body: JSON.stringify({
        id, mes: MES, monto: Number(g('monto')), tipo: g('tipo'),
        comercio: g('comercio'), categoria: g('categoria') }) });
      ABIERTO = null; toast('Guardado'); cargar();
    } catch (err) { toast('No se guardó: ' + err.message); }
    return;
  }
  if (e.target.closest('.edit')) return;   // no cerrar al tocar el formulario
  const card = e.target.closest('.mov');
  if (!card) return;
  ABIERTO = ABIERTO === card.dataset.id ? null : card.dataset.id;
  render();
});

$('prev').onclick = () => { MES = mesSuma(MES,-1); ABIERTO = null; cargar(); };
$('next').onclick = () => { if (MES < mesHoy()){ MES = mesSuma(MES,1); ABIERTO = null; cargar(); } };
$('sueldo-lbl').parentElement.onclick = abrirSueldo;

function cerrarSheet(){ $('sheet').classList.remove('on'); }
$('sheet').addEventListener('click', e => { if (e.target === $('sheet')) cerrarSheet(); });

function abrirSueldo(){
  $('sheet-t').textContent = 'Tu sueldo mensual';
  $('sheet-body').innerHTML = `
    <div><label style="font-size:.7rem;color:var(--ink-3)">Lo que te entra cada mes (DNP)</label>
    <input id="s-sueldo" type="number" inputmode="numeric" value="${DATA && DATA.sueldo ? DATA.sueldo : ''}" placeholder="8500000"></div>
    <div><label style="font-size:.7rem;color:var(--ink-3)">Tu nombre como lo escribe el banco</label>
    <input id="s-titular" value="${esc(CFG.titular||'')}" placeholder="Ricardo Esteban Ruiz Castro">
    <div class="nota" style="margin:.4rem 0 0">Sirve para reconocer las transferencias que te haces a ti mismo y no contarlas como ingreso.</div></div>
    <div class="acts"><button class="b ghost" id="s-cancel">Cancelar</button><button class="b" id="s-ok">Guardar</button></div>`;
  $('sheet').classList.add('on');
  $('s-cancel').onclick = cerrarSheet;
  $('s-ok').onclick = async () => {
    try { await api('/gastos/config', { method:'POST', body: JSON.stringify({
            sueldo: Number($('s-sueldo').value)||0, titular: $('s-titular').value }) });
          CFG.titular = $('s-titular').value;
          cerrarSheet(); toast('Guardado'); cargar(); }
    catch (e) { toast('No se guardó: ' + e.message); }
  };
}

$('fab').onclick = () => {
  $('sheet-t').textContent = 'Anotar a mano';
  $('sheet-body').innerHTML = `
    <div class="row">
      <div><label style="font-size:.7rem;color:var(--ink-3)">Monto</label><input id="m-monto" type="number" inputmode="decimal" placeholder="25000"></div>
      <div><label style="font-size:.7rem;color:var(--ink-3)">Tipo</label><select id="m-tipo"><option value="gasto">Gasto</option><option value="ingreso">Ingreso</option><option value="traslado">Traslado</option></select></div>
    </div>
    <div><label style="font-size:.7rem;color:var(--ink-3)">En qué / de quién</label><input id="m-com" placeholder="Almuerzo"></div>
    <div><label style="font-size:.7rem;color:var(--ink-3)">Categoría</label><select id="m-cat">${CATS.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div>
    <div class="acts"><button class="b ghost" id="m-cancel">Cancelar</button><button class="b" id="m-ok">Anotar</button></div>`;
  $('sheet').classList.add('on');
  $('m-cancel').onclick = cerrarSheet;
  $('m-ok').onclick = async () => {
    const monto = Number($('m-monto').value);
    if (!(monto > 0)) return toast('Falta el monto');
    try {
      await api('/gastos/manual', { method:'POST', body: JSON.stringify({
        monto, tipo: $('m-tipo').value, comercio: $('m-com').value, categoria: $('m-cat').value, banco:'efectivo' }) });
      cerrarSheet(); toast('Anotado');
      MES = mesHoy(); cargar();
    } catch (e) { toast('No se anotó: ' + e.message); }
  };
};

if ('serviceWorker' in navigator) navigator.serviceWorker.register('gastos-sw.js').catch(()=>{});
arrancar();
</script>
</body>
</html>
